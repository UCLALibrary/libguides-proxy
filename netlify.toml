[build]
  functions = "netlify/functions"  # Directory for Netlify Functions

[[redirects]]
  from = "/api/libguides/global/proxy"              # Route for the proxy service
  to = "/.netlify/functions/globalDataProxy" # Serverless function endpoint
  status = 200

[[redirects]]
  from = "/api/libguides/library/status/updates/proxy"              # Route for the proxy service
  to = "/.netlify/functions/libraryStatusUpdatesProxy" # Serverless function endpoint
  status = 200

[[redirects]]
  from = "/api/libguides/ftva/global/proxy"              # Route for the proxy service
  to = "/.netlify/functions/ftvaGlobalProxy" # Serverless function endpoint
  status = 200

# Live LibGuides Search proxy for GitHub Pages previews.
[[redirects]]
  from = "/api/libguides/search/proxy"
  to = "/.netlify/functions/search-proxy"
  status = 200

[[redirects]]
  from = "/api/libguides/az/databases/proxy"
  to = "/.netlify/functions/azDatabasesProxy"
  status = 200
